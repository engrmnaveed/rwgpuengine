# CI runs exactly what developers run locally.
#
# `ci` is `cargo xtask ci`: fmt, clippy (native + wasm), tests, generated-docs
# drift, example playtests, the hard budgets in budgets.toml, and the check
# that the wasm module gives the native command's state hashes and pixels.
# It never needs a GPU and never compiles wgpu.
#
# `gpu` is `cargo xtask gpu`: the players' half. It holds the wgpu renderer
# to the CPU reference renderer, replays every example playtest with the
# native player and with the web player in a headless Chrome (WebGPU and the
# CPU fallback), and enforces the players' budgets (ADR 0021, 0022, 0024).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The [time] budgets are written for the reference machine; runners are slower.
      RWGPU_TIME_BUDGET_SCALE: "4"
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version, components and the wasm target;
      # rustup installs them on first use.
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Node is on every GitHub runner; the wasm check needs it.
      - name: Node version
        run: node --version
      - name: cargo xtask ci
        run: cargo xtask ci

  # GitHub's runners have no graphics card. Linux draws with Mesa's software
  # Vulkan driver (lavapipe), Windows with WARP (Direct3D 12), macOS with the
  # runner's virtual GPU (Metal). wgpu picks each by itself.
  gpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RWGPU_TIME_BUDGET_SCALE: "4"
      # The browser check runs this many times in a row: a new check is
      # trusted only after it held several times (ADR 0024).
      RWGPU_BROWSER_RUNS: "3"
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu
          workspaces: |
            . -> target
            players -> target
          # The pinned wasm-bindgen tool, installed there by xtask on first use (ADR 0024).
          cache-directories: target/tools
      # And, for a window, a virtual X display and the keyboard library winit loads.
      - name: Install Mesa's software Vulkan driver and a virtual display
        if: runner.os == 'Linux'
        # Without `apt-get update` first when the image's package lists still resolve.
        run: |
          pkgs="mesa-vulkan-drivers libvulkan1 xvfb libxkbcommon-x11-0"
          sudo apt-get install -y --no-install-recommends $pkgs \
            || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends $pkgs; }
      # `--window` adds a playtest replayed in a real window, its picture read
      # back and compared with the reference. Linux has no desktop: Xvfb gives
      # it an X display, and lavapipe draws into it.
      - name: cargo xtask gpu --window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" cargo xtask gpu --window
          else
            cargo xtask gpu --window
          fi
      # A measurement, not a gate: the options ADR 0021 chose between, on this
      # runner's adapter. It reuses the build of the step before.
      - name: cargo xtask gpu --study
        if: always()
        run: cargo xtask gpu --study -- --no-timing
      # The reference's picture, the GPU's and their difference, for every scene
      # that failed; what the window showed (target/player); and the browser's
      # frames and results (target/web-check).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gpu-check-${{ matrix.os }}
          path: |
            target/gpu-check
            target/player
            target/web-check/*.rgba
            target/web-check/frames.txt
          retention-days: 14
          if-no-files-found: ignore
