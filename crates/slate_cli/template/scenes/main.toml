# Starter scene: step on the plate to open the door.
#
# Grid: +x runs down-right on screen, +y down-left, z is height.
# The ground is 6x6: cells (0, 0) to (5, 5).

[scene]
name = "Starter"
doc = "Step on the plate to open the door."

[ground]
size = [6, 6]

[[entity]]
name = "player"
prefab = "player"
pos = [1, 1]

# A wall along x = 3, with the door at (3, 4).
[[entity]]
prefab = "wall"
cells = [[3, 0], [3, 1], [3, 2], [3, 3], [3, 5]]

[[entity]]
name = "door"
prefab = "door"
pos = [3, 4]

[[entity]]
name = "plate"
prefab = "plate"
pos = [1, 4]

[[connect]]
from = "plate"
signal = "pressed"
to = "door"
action = "disable"
