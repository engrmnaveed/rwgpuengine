# Playtest: scripted input plus expectations. Run with `rwgpu test`.
# A mover steps once every 8 frames while a direction is held,
# so `for = 24` gives exactly three steps.

[test]
doc = "Step on the plate, walk through the opened door."
scene = "scenes/main.toml"
frames = 120

[[input]]
frame = 10
hold = "down"        # (1, 2) (1, 3) (1, 4) = plate: the door opens
for = 24

[[input]]
frame = 60
hold = "right"       # (2, 4) (3, 4) open door, (4, 4)
for = 24

[[expect]]
entity = "player"
pos = [4, 4]

[[expect]]
entity = "door"
enabled = false

[[expect]]
event = "signal"
signal = "pressed"
