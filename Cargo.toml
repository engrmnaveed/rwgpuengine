# rwgpuengine — an agent-native game engine in Rust. Its command is `rwgpu`.
# See README.md for the overview and docs/architecture.md for the layer map.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo build` / `cargo test` at the root cover the engine crates; xtask is
# dev automation and is run through the `cargo xtask` alias.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
# License is an open decision (docs/open-questions.md, Q2). Nothing is published yet.

[workspace.dependencies]
# Owned crates.
rwgpuengine_core = { path = "crates/rwgpuengine_core" }
rwgpuengine_data = { path = "crates/rwgpuengine_data" }
rwgpuengine_sim = { path = "crates/rwgpuengine_sim" }
rwgpuengine_render = { path = "crates/rwgpuengine_render" }
rwgpuengine_runtime = { path = "crates/rwgpuengine_runtime" }
rwgpuengine_cli = { path = "crates/rwgpuengine_cli" }

# Rented crates. Keep this list short; every addition needs an ADR or a note in
# docs/decisions/0004-few-dependencies-no-proc-macros.md.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
png = "0.18"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# Determinism guardrails live in clippy.toml (disallowed methods/types).
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "warn"
todo = "warn"
# Diagnostics are rich (message, location, hint, notes) and only travel on
# the error path; boxing them would buy nothing.
result_large_err = "allow"

[profile.dev]
# Keep debug info light: faster links, faster edit-and-verify loop.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (png/deflate) are much faster optimized and rarely rebuilt.
opt-level = 2

[profile.release]
debug = false
strip = true

# Browser build (cargo xtask web): size-first, except the hot path
# (ADR 0017). Measured on Tiny Town (640x480, browser): "s" 674,719 bytes and
# 4.29 ms/frame; "z" 631,342 and 5.22; "3" 754,461 and 2.72; this mix 643,317
# and 2.72 (identical hashes). `cargo xtask budgets` checks the overrides.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.web.package.rwgpuengine_render]
opt-level = 3

[profile.web.package.rwgpuengine_core]
opt-level = 3
