# Hard limits, enforced by `cargo xtask budgets` (part of `cargo xtask ci`).
# The build fails when a measurement exceeds its limit: "lightweight" is a
# number, not an adjective.
#
# Raising a limit is allowed only in a commit whose message says why and
# what was measured (docs/conventions.md#budgets). A limit of 0 means "not
# enforced yet" and is reported as such.

[web]
# rwgpuengine_web.wasm built with the `web` profile. v0.1.0 measured 466,628 bytes;
# M3.4 with the hybrid profile (ADR 0017) 643,317 (234,702 gzipped). Raised
# from 700,000 by the owner's call to leave room for more features (ADR 0017).
# With the paint path the web module no longer holds the reference rasterizer
# or the frame report: 585,725 (215,418 gzipped) (ADR 0018).
wasm_bytes = 800_000

[cli]
# Release `rwgpu` binary (stripped). v0.1.0 measured ~1.3 MB on aarch64-apple-darwin.
binary_bytes = 3_000_000

[deps]
# External (non-rwgpu) crates in the runtime's normal dependency tree.
runtime_crates = 20
# Proc-macro crates anywhere in the runtime tree. Zero is the policy (ADR 0004).
proc_macro_crates = 0

# What git tracks, checked by `cargo xtask repo-check`, the first step of
# `cargo xtask ci` (ADR 0023).
[repo]
# The largest tracked file, in bytes. Measured on 2026-11-26: the largest of
# 314 files is crates/rwgpuengine_data/src/load.rs at 75,685 bytes; then a
# reference picture (70,441) and players/Cargo.lock (62,606 with the native
# player). The limit is twice the largest, rounded. The rwgpu command is
# about 2,000,000 bytes and the web module 620,000: build output does not fit.
file_bytes = 150_000

# The [time] limits are for the reference machine (an Apple M5 Pro). On
# slower machines set RWGPU_TIME_BUDGET_SCALE (CI uses 4): the limits are
# multiplied, so a large regression still fails there.
[time]
# new -> check -> run 300 -> shot -> inspect -> test with the release binary.
smoke_chain_ms = 4_000
# Recompile rwgpuengine_sim and everything above it (dev profile): the code edit
# loop. v0.1.0 measured 0.38 s on an Apple M5 Pro; CI runners are slower.
incremental_rebuild_ms = 10_000
# Render one 640x480 frame of Tiny Town with its town built (release build,
# native; `cargo xtask render-bench`). M3.4 measured ~2,270 us on an Apple M5
# Pro, and the 3D reference renderer about 1,600. The limit catches a rasterizer regression of ~2.5x on slower CI
# machines; the web profile's opt-levels are checked separately (ADR 0017).
# This is the reference path: `rwgpu shot`, playtest `[[shot]]`s and reports.
render_frame_us = 6_000
# Paint the same frame the way a player does when the picture changed:
# build the render list and paint it, no owners and no report (ADR 0020).
# Since the world is drawn in 3D through a depth buffer this measures about
# 160 us on an Apple M5 Pro (the flat 2D painter of ADR 0018 took 55-60).
# The limit is unchanged; it now leaves 1.25x on the reference machine.
paint_frame_us = 200
# Draw a town of 5,000 boxes on a 71 x 71 ground at 1280x720, in
# perspective, with the CPU reference renderer: the render list, its
# projection and the pixels with their owners, no report (`cargo xtask
# render-bench` builds the town). The limit is the 3D proposal's; measured
# about 5.5 ms on an Apple M5 Pro.
reference_town_frame_us = 20_000
# One simulation step of a town of 50,000 wanderers on every other cell of a
# 448 x 448 ground, each trying one cell a step, with events written as a game
# writes them by default (ADR 0027; `cargo xtask sim-bench town` builds the
# town): the median of 200 steps. The limit is the 3D proposal's (section 5).
# Measured 1.0 to 1.1 ms on an Apple M5 Pro; with every event written, as
# before ADR 0027, it was 14 ms.
sim_step_us = 2_000
# Load and check the 3D study's town of 50,000 wanderers on every other cell
# of a 448 x 448 ground, written as files, as `rwgpu check` does (ADR 0028;
# `cargo xtask load-bench town` writes the town): the median of 7 runs.
# Measured 76 to 82 ms on an Apple M5 Pro; before ADR 0028 the loader took
# 1,635 ms, growing with the square of the town. The limit leaves 3x.
load_check_ms = 250

[tablet]
# Cold start of the web player on a mid-range tablet. Needs a device to
# measure on; see docs/open-questions.md (Q8).
startup_ms = 0

# The players' half (players/): everything that needs a GPU. It has its own
# budgets (the 3D proposal, section 5), measured and enforced by
# `cargo xtask gpu`, not by `cargo xtask ci` (ADR 0021).
[players]
# Rented crates in the normal dependency tree of the players' workspace, on
# the system where that is the most. Measured with the window library
# (winit 0.30.13 with X11 and Wayland, ADR 0022): Linux 105, Windows 87,
# macOS 84 (and 54 for the renderer alone on wasm32). Without it they were
# Windows 76, macOS 67, Linux 65.
crates = 130
# Proc-macro crates in that tree, each version once, on the system where
# that is the most. Measured: Linux 6 (winit brings `thiserror` 1 beside 2,
# and Wayland `wayland-scanner`), Windows 6 (`windows-implement` and
# `windows-interface` come with Direct3D 12), macOS 5. Neither Linux nor
# Windows has one to spare.
proc_macro_crates = 6
# A clean release build of the players' workspace: the check and the native
# player (wgpu, winit, the renderer, and the agent's crates they use). A time
# budget: scaled by RWGPU_TIME_BUDGET_SCALE. Measured 13.6 to 17.8 s on an
# Apple M5 Pro (12 to 17 s for the check alone, before the player); 37 to
# 113 s on GitHub's runners for the check alone.
clean_release_build_ms = 60_000
# One frame of 50,000 boxes on a 224 x 224 ground at 1280x720, with nothing
# uploaded, until the GPU has finished it. Enforced only on a real GPU (a
# software adapter's time is printed); scaled like the other time budgets.
# Measured 1.0 to 1.75 ms on an Apple M5 Pro, 6.2 to 9.0 on the macOS runner.
gpu_frame_us = 4_000
# The wgpu renderer against the CPU reference, per reference scene: the most
# pixels that may differ. Each must also lie on an edge of the reference
# picture; there is no per-channel tolerance. Measured over the 271 scenes:
# at most 7 on Metal (an Apple M5 Pro and the macOS runner), 5 on WARP, 12 on
# Mesa lavapipe, each for the town of 5,000 boxes through a turned camera.
# The limit is twice the worst; the proposal allowed 50. The web player's
# frames in a browser are held to it too (ADR 0024): 0 apart on this Mac.
pixels_apart = 24
# The bytes a browser downloads for the web player (ADR 0024): the four files
# `cargo xtask web-player` writes to target/web-player and `rwgpu serve`
# serves as they are, uncompressed: index.html, player.js (the page's
# script), rwgpu_web.js (the glue written by wasm-bindgen) and
# rwgpu_web_bg.wasm (the engine, the renderer, wgpu's WebGPU backend and the
# CPU reference painter for the fallback). A game's own files (the bundle)
# are not counted. Approved in the 3D proposal, section 5. Measured 770,648
# bytes (297,321 gzipped) on 2026-11-26.
web_download_bytes = 1_500_000
