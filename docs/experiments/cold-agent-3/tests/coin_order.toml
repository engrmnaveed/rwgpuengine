# The HUD digit counts coins, whichever order they are taken in.
# Same frames as vault_run but coin2 is taken first: at frame 48 the player is on the
# same cell with the same two coins, so the frame must match vault_run's frame-48
# reference pixel for pixel.

[test]
doc = "Collect coin2 before coin1: HUD shows 1 then 2, identical to vault_run at frame 48."
scene = "scenes/main.toml"
frames = 49

[[input]]
frame = 2
press = "up"         # (2, 1) = coin2 -> HUD 1
[[input]]
frame = 10
press = "down"       # (2, 2)
[[input]]
frame = 18
press = "down"       # (2, 3)
[[input]]
frame = 26
press = "down"       # (2, 4) = coin1 -> HUD 2
[[input]]
frame = 34
press = "up"         # (2, 3)
[[input]]
frame = 42
press = "up"         # (2, 2)

[[expect]]
frame = 20
entity = "coin2"
enabled = false
[[expect]]
frame = 20
entity = "coin1"
enabled = true
[[expect]]
entity = "coin1"
enabled = false
[[expect]]
entity = "player"
pos = [2, 2]

[[shot]]
frame = 20
reference = "tests/refs/coin_order_f020_hud1.png"
[[shot]]
frame = 48
reference = "tests/refs/vault_f048_hud2.png"
