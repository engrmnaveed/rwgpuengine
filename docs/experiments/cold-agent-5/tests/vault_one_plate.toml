# Negative playtest: with only ONE plate held (the golem on plate_b, nobody on
# plate_a) the vault door stays closed and solid, and the player walking into
# it is blocked.

[test]
doc = "Only plate_b held: the vault door stays closed and blocks the player."
scene = "scenes/main.toml"
frames = 120

[[input]]
frame = 0
hold = "up"          # 4 steps: (0, 6) (0, 5) (0, 4) (0, 3)
for = 32

[[input]]
frame = 40
hold = "right"       # 4 steps: (1, 3) (2, 3) (3, 3) (4, 3), right in front of the door
for = 32

[[input]]
frame = 80
hold = "up"          # tries to walk into the door at (4, 2) at steps 80, 88, 96
for = 24

[[expect]]
frame = 100
entity = "golem"     # plate_b is held ...
pos = [6, 4]

[[expect]]
frame = 100
event = "trigger"    # ... and plate_a was never stepped on
entity = "plate_a"
at_most = 0

[[expect]]
frame = 100
entity = "vault_door"
enabled = true
solid = true

[[expect]]
frame = 100
event = "skipped"    # the golem's `pressed` on plate_b was refused by the `when`
entity = "vault_door"
signal = "pressed"
at_least = 1

[[expect]]
event = "blocked"
entity = "player"
other = "vault_door"
reason = "solid"
at_least = 3
at_most = 3

[[expect]]
entity = "player"
pos = [4, 3]

[[expect]]
event = "action"     # the door was never opened
entity = "vault_door"
signal = "pressed"
at_most = 0

[[expect]]
entity = "hud"       # no coin on this route
text = "Coins: 0/3"
