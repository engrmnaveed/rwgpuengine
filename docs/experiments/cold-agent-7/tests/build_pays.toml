[test]
doc = "Each tool builds where tapped and pays its cost: barn 5, crop patch 1, fence post 2 (10 -> 2 seeds)."
scene = "scenes/main.toml"
frames = 20

[[input]]
frame = 2
tap = [131, 456]     # btn_barn

[[input]]
frame = 4
tap = [128, 192]     # field cell (0, 5): barn covers (0..2, 5..6)

[[input]]
frame = 6
tap = [280, 456]     # btn_crop

[[input]]
frame = 8
tap = [192, 288]     # field cell (4, 7)

[[input]]
frame = 10
tap = [438, 456]     # btn_fence

[[input]]
frame = 12
tap = [288, 304]     # field cell (6, 6)

# After the barn: 10 - 5 = 5 seeds.
[[expect]]
frame = 5
prefab = "barn"
count = 1
pos = [0, 5]

[[expect]]
frame = 5
entity = "farm"
props = { seeds = 5, barns = 1 }

# After the crop patch: 5 - 1 = 4.
[[expect]]
frame = 9
prefab = "crop"
count = 1
pos = [4, 7]

[[expect]]
frame = 9
entity = "farm"
props = { seeds = 4, crops = 1 }

# After the fence post: 4 - 2 = 2, and the HUD shows it.
[[expect]]
prefab = "fence"
count = 1
pos = [6, 6]

[[expect]]
entity = "farm"
props = { seeds = 2, barns = 1, crops = 1 }
text = "Seeds: 2\nBarns: 1  Crops: 1"

[[expect]]
entity = "tool"
text = "Tool: fence"

[[expect]]
event = "spawned"
at_least = 3
at_most = 3

[[expect]]
event = "blocked"
at_most = 0
