# The player holds plate_b, a crate holds plate_a.
# plate_b alone: shut. crate on plate_a alone: shut. Both: open.
# Stepping off plate_b (in two different directions) closes it each time.

[test]
doc = "Door opens only while both plates are held; the player stepping off plate_b closes it."
scene = "scenes/main.toml"
frames = 230

[[input]]
frame = 0
hold = "right"       # (2, 1) (3, 1) (4, 1)
for = 24

[[input]]
frame = 32
hold = "down"        # (4, 2) = plate_b, plate_a empty: door stays shut
for = 8

[[input]]
frame = 48
hold = "up"          # (4, 1), off plate_b
for = 8

[[input]]
frame = 64
hold = "left"        # (3, 1) (2, 1)
for = 16

[[input]]
frame = 88
hold = "down"        # (2, 2)
for = 8

[[input]]
frame = 104
hold = "down"        # pushes crate_a onto plate_a (2, 4); player (2, 3). plate_b empty: door stays shut
for = 8

[[input]]
frame = 120
hold = "up"          # (2, 2) (2, 1)
for = 16

[[input]]
frame = 144
hold = "right"       # (3, 1) (4, 1)
for = 16

[[input]]
frame = 168
hold = "down"        # (4, 2) = plate_b, crate on plate_a: door OPENS
for = 8

[[input]]
frame = 184
hold = "up"          # (4, 1), off plate_b: door CLOSES
for = 8

[[input]]
frame = 200
hold = "down"        # (4, 2) = plate_b again: door OPENS
for = 8

[[input]]
frame = 216
hold = "right"       # (5, 2), off plate_b the other way: door CLOSES
for = 8

# plate_b alone does not open it
[[expect]]
frame = 40
entity = "player"
pos = [4, 2]

[[expect]]
frame = 40
entity = "door"
enabled = true

[[expect]]
frame = 40
event = "skipped"
entity = "door"
other = "plate_b"
signal = "pressed"

# crate on plate_a alone does not open it
[[expect]]
frame = 115
entity = "crate_a"
pos = [2, 4]

[[expect]]
frame = 115
entity = "door"
enabled = true

[[expect]]
frame = 115
event = "skipped"
entity = "door"
other = "plate_a"
signal = "pressed"

# both held: open
[[expect]]
frame = 180
entity = "player"
pos = [4, 2]

[[expect]]
frame = 180
entity = "door"
enabled = false

# stepped off plate_b: shut
[[expect]]
frame = 195
entity = "player"
pos = [4, 1]

[[expect]]
frame = 195
entity = "door"
enabled = true

# back on: open
[[expect]]
frame = 210
entity = "door"
enabled = false

# stepped off the other way: shut
[[expect]]
entity = "player"
pos = [5, 2]

[[expect]]
entity = "door"
enabled = true

# Exactly two openings, both caused by plate_b going down while plate_a was held.
[[expect]]
event = "action"
entity = "door"
signal = "pressed"
at_least = 2
at_most = 2

# The door is open in this frame: player on plate_b, crate on plate_a.
[[shot]]
frame = 180
reference = "tests/refs/and_player_on_b_open.png"

# The door is shut again in this frame: the player stepped off plate_b to (4, 1).
[[shot]]
frame = 195
reference = "tests/refs/and_player_on_b_closed.png"
