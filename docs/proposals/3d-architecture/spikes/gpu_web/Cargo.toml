[package]
name = "gpu_web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# The WebGL2 fallback for browsers without WebGPU: measured for its size only.
webgl = ["wgpu/webgl"]

[dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
