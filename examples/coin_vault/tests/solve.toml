# Collect the coins in one order, open the vault, hold plate_b while the
# statue holds plate_a: the chest opens and the HUD and banner say so.
[test]
scene = "scenes/vault.toml"
frames = 200

[[input]]
frame = 0
hold = "right"       # (1, 0), (2, 0) = coin1
for = 16

[[input]]
frame = 20
hold = "down"        # (2, 1), (2, 2), (2, 3)
for = 24

[[input]]
frame = 50
hold = "left"        # (1, 3) = coin2
for = 8

[[input]]
frame = 60
hold = "down"        # (1, 4), (1, 5)
for = 16

[[input]]
frame = 80
hold = "right"       # (2, 5), (3, 5) = coin3: 3 coins, the door opens
for = 16

[[input]]
frame = 100
hold = "up"          # (3, 4), (3, 3), (3, 2)
for = 24

[[input]]
frame = 130
hold = "right"       # (4, 2), (5, 2) through the door, (6, 2), (7, 2)
for = 32

[[input]]
frame = 170
hold = "down"        # (7, 3), (7, 4) = plate_b
for = 16

# The count and what the HUD shows, right after the third coin.
[[expect]]
frame = 100
entity = "hud"
props = { coins = 3 }
text = "Coins: 3/3"

[[expect]]
frame = 100
entity = "door"
enabled = false

[[expect]]
frame = 100
entity = "banner"
text = "The vault is open!"

# The end: on plate_b with the statue on plate_a, the chest is open.
[[expect]]
entity = "player"
pos = [7, 4]

[[expect]]
entity = "chest"
enabled = true

[[expect]]
entity = "banner"
text = "Treasure found!"

[[expect]]
event = "action"
entity = "hud"
at_least = 3
at_most = 3

[[shot]]
reference = "tests/refs/solve.png"
