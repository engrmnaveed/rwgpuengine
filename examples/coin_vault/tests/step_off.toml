# The chest is open only WHILE both plates are held: stepping off plate_b
# closes it again.
[test]
scene = "scenes/vault.toml"
frames = 240

[[input]]
frame = 0
hold = "right"
for = 16

[[input]]
frame = 20
hold = "down"
for = 24

[[input]]
frame = 50
hold = "left"
for = 8

[[input]]
frame = 60
hold = "down"
for = 16

[[input]]
frame = 80
hold = "right"
for = 16

[[input]]
frame = 100
hold = "up"
for = 24

[[input]]
frame = 130
hold = "right"
for = 24

[[input]]
frame = 160
press = "up"         # crate onto plate_a

[[input]]
frame = 180
hold = "right"
for = 8

[[input]]
frame = 190
hold = "down"        # onto plate_b: the chest opens
for = 24

[[input]]
frame = 225
press = "up"         # off plate_b: it closes

[[expect]]
frame = 220
entity = "chest"
enabled = true

[[expect]]
entity = "player"
pos = [7, 3]

[[expect]]
entity = "chest"
enabled = false

[[expect]]
event = "action"
entity = "chest"
signal = "released"
