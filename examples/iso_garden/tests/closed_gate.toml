# Skipping the plate: the gate stays shut and the event log says why.

[test]
doc = "Walking straight to the gate without the plate is blocked."
frames = 160

[[input]]
frame = 10
hold = "down"        # (1, 2) (1, 3) (1, 4)
for = 24

[[input]]
frame = 50
hold = "right"       # (2, 4) (3, 4)
for = 16

[[input]]
frame = 80
press = "down"       # (3, 5)

[[input]]
frame = 100
press = "right"      # blocked by the closed gate at (4, 5)

[[expect]]
entity = "player"
pos = [3, 5]

[[expect]]
entity = "gate"
enabled = true

[[expect]]
event = "blocked"
entity = "player"
